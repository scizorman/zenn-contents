name: 'CI'

on:
  - 'pull_request'

permissions: {}

jobs:
  lint:
    runs-on: 'ubuntu-slim'
    permissions:
      contents: 'read'
    timeout-minutes: 5
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7
        with:
          persist-credentials: false
      - uses: 'cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b' # v31
      - run: |
          nix develop --command make lint
