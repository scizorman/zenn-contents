name: 'CI'

on:
  - 'pull_request'

permissions: {}

jobs:
  lint:
    runs-on: 'ubuntu-slim'
    permissions:
      contents: 'read'
    timeout-minutes: 5
    steps:
      - uses: 'actions/checkout@v7.0.1'
        with:
          persist-credentials: false
      - uses: 'cachix/install-nix-action@v31.11.3'
      - run: |
          nix develop --command make lint
  verify-github-actions-lock:
    runs-on: 'ubuntu-slim'
    permissions:
      contents: 'read'
    timeout-minutes: 5
    steps:
      - uses: 'actions/checkout@v7.0.1'
        with:
          persist-credentials: false
      - run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify
        env:
          GH_TOKEN: '${{ github.token }}'
